name: Build Linux release from upstream tag

on:
  schedule:
    # Daily at 03:17 UTC. Off-peak hour avoids the top-of-hour Actions queue.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Build one version, e.g. v0.27.0 (empty = backfill all newer tags)"
        required: false
        type: string
      force:
        description: "With tag: rebuild even if that version is already published"
        required: false
        type: boolean
        default: false
      containerized:
        description: "Build inside electronuserland/builder Docker for wider glibc compatibility"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: linux-release-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: nexu-io/open-design
  TARGET_REPO: ${{ github.repository }}
  NAMESPACE: release-linux

jobs:
  resolve:
    name: Resolve tags to build via API
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
      cursor: ${{ steps.resolve.outputs.cursor }}
    steps:
      - name: Resolve tags
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          version_gt() {
            local newer="$1" older="$2"
            [ "$newer" != "$older" ] || return 1
            [ "$(printf '%s\n%s\n' "$older" "$newer" | sort -V | tail -n 1)" = "$newer" ]
          }

          is_completed() {
            local want="$1" x
            for x in "${completed[@]:-}"; do
              [ "$x" = "$want" ] && return 0
            done
            return 1
          }

          # Upstream stable tags -> bare versions, ascending.
          upstream_raw="$(gh api "repos/${UPSTREAM_REPO}/tags?per_page=100" --paginate --jq '.[].name')"
          mapfile -t upstream_versions < <(printf '%s\n' "$upstream_raw" \
            | grep -E '^open-design-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^open-design-v//' | sort -V || true)
          if [ "${#upstream_versions[@]}" -eq 0 ]; then
            echo "::error::No open-design-vX.Y.Z tags found in ${UPSTREAM_REPO}"
            exit 1
          fi

          # Diff against COMPLETED builds, not bare tags. `gh release create`
          # writes the vX.Y.Z tag before the assets finish uploading, so a tag
          # left behind by a failed/partial upload is not a build. Only a release
          # carrying BOTH expected assets counts; anything else is retried.
          completed_raw="$(gh api "repos/${TARGET_REPO}/releases?per_page=100" --paginate --jq '
            .[]
            | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
            | (.tag_name | ltrimstr("v")) as $v
            | select(([.assets[].name] | index("open-design-\($v)-linux-x64.AppImage")) != null)
            | select(([.assets[].name] | index("open-design-\($v)-linux-x64.AppImage.sha256")) != null)
            | $v
          ')"
          mapfile -t completed < <(printf '%s\n' "$completed_raw" | sed '/^$/d' | sort -V)
          cursor=""
          if [ "${#completed[@]}" -gt 0 ]; then
            cursor="${completed[-1]}"
          fi

          if [ -n "${INPUT_TAG:-}" ]; then
            # Accept v0.27.0, 0.27.0 or open-design-v0.27.0.
            v="${INPUT_TAG#open-design-v}"
            v="${v#v}"
            candidates=("$v")
          elif [ -z "$cursor" ]; then
            # No complete release yet: bootstrap with only the newest upstream
            # version instead of replaying the whole release history.
            candidates=("${upstream_versions[-1]}")
            echo "::notice::No complete vX.Y.Z release in ${TARGET_REPO}; bootstrapping with ${candidates[0]}"
          else
            # Set-style diff: every upstream version at or above the oldest
            # complete release that has NO complete release here. This picks up
            # same-day multi-tag releases and also repairs holes left by an
            # earlier partial failure, without replaying ancient history below
            # the floor. The matrix stays in ascending version order.
            floor="${completed[0]}"
            candidates=()
            for v in "${upstream_versions[@]}"; do
              if version_gt "$floor" "$v"; then
                continue
              fi
              if is_completed "$v"; then
                continue
              fi
              candidates+=("$v")
            done
          fi

          matrix='{"include":[]}'
          count=0
          for v in "${candidates[@]}"; do
            [ -n "$v" ] || continue
            upstream_tag="open-design-v${v}"
            release_tag="v${v}"

            # Release notes come from the matching upstream release.
            if ! gh api "repos/${UPSTREAM_REPO}/releases/tags/${upstream_tag}" >/dev/null 2>&1; then
              echo "::notice::${upstream_tag}: no published upstream release, skipping"
              continue
            fi

            # Idempotency: a complete release is left alone unless forced.
            if [ "${FORCE:-false}" != "true" ] && is_completed "$v"; then
              echo "::notice::${release_tag}: already published with assets, skipping"
              continue
            fi

            matrix="$(printf '%s' "$matrix" | jq -c \
              --arg upstream_tag "$upstream_tag" \
              --arg release_tag "$release_tag" \
              --arg version "$v" \
              '.include += [{upstream_tag:$upstream_tag, release_tag:$release_tag, version:$version}]')"
            count=$((count + 1))
          done

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "cursor=${cursor:-none}" >> "$GITHUB_OUTPUT"

          {
            echo "### Tags to build"
            echo "Cursor (latest complete release): \`${cursor:-none}\`"
            echo "Floor (oldest complete release): \`${floor:-${cursor:-none}}\`"
            echo "Complete releases: ${#completed[@]}"
            if [ "$count" -eq 0 ]; then
              echo "Nothing to do — every upstream tag from the floor up has a complete release."
            else
              printf '%s' "$matrix" | jq -r '.include[].release_tag' | sed 's/^/- `/; s/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & publish ${{ matrix.release_tag }}
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    strategy:
      # One runner at a time, in version order. Stop the chain at the first
      # failure so a broken v0.28.0 never gets leapfrogged by a later v0.28.1
      # (which would move the cursor past the hole and hide it forever).
      max-parallel: 1
      fail-fast: true
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      UPSTREAM_TAG: ${{ matrix.upstream_tag }}
      RELEASE_TAG: ${{ matrix.release_tag }}
      VERSION: ${{ matrix.version }}
      CONTAINERIZED: ${{ inputs.containerized }}
    steps:
      - name: Checkout upstream source at tag
        uses: actions/checkout@v4
        with:
          repository: nexu-io/open-design
          ref: ${{ matrix.upstream_tag }}
          path: source

      - name: Patch AppRun to fall back to extract-and-run
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/pack/src/linux.ts")
          src = path.read_text()
          anchor = 'THIS="$0"\nargs=("$@")\nNUMBER_OF_ARGS="$#"\n'
          if src.count(anchor) != 1:
              raise SystemExit("::error::AppRun template changed; cannot apply extract-and-run patch")

          patch = r'''THIS="$0"
          args=("$@")
          NUMBER_OF_ARGS="$#"

          # A direct FUSE-mounted AppImage launch demand-pages the bundled Node payload
          # through a cold squashfs on every start, so the packaged sidecar misses its
          # startup budget (see upstream tools/pack README). Re-exec the outer AppImage
          # in extract-and-run mode so the payload runs from a real filesystem. Extracted
          # runs keep OD_APPIMAGE_FALLBACK in the environment and skip this branch.
          if [ -z "\${OD_APPIMAGE_FALLBACK:-}" ] && [ -n "\${APPIMAGE:-}" ] && [ -x "\${APPIMAGE}" ] && [[ "\${APPDIR:-}" == /tmp/.mount_* ]]; then
            export OD_APPIMAGE_FALLBACK=1
            exec "\${APPIMAGE}" --appimage-extract-and-run "\${args[@]}"
          fi
          '''
          path.write_text(src.replace(anchor, patch, 1))
          PY
          grep -n "OD_APPIMAGE_FALLBACK" tools/pack/src/linux.ts

      - name: Patch web next.config fingerprint guard
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Linux packs in `server` mode and therefore ships @open-design/web/src.
          # That makes next.config.ts's guard (one source file exists) pass at
          # runtime, after which it tries to read monorepo-only files such as
          # apps/web/app/layout.tsx, so the web sidecar dies on boot and the
          # whole sidecar generation is retired. Only compute the build-time
          # fingerprint when ALL inputs are present (i.e. in a source checkout).
          path = Path("apps/web/next.config.ts")
          src = path.read_text()
          old = "existsSync(resolve(WEB_ROOT, 'src/components/touchpoint-component.ts'))"
          new = "CMS_HOST_RELEASE_INPUTS.every((file) => existsSync(resolve(WORKSPACE_ROOT, file)))"
          if src.count(old) != 1:
              raise SystemExit("::error::next.config fingerprint guard changed; cannot apply packaged-runtime fix")
          path.write_text(src.replace(old, new, 1))
          PY
          grep -n "CMS_HOST_RELEASE_INPUTS.every" apps/web/next.config.ts

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build Linux AppImage
        working-directory: source
        run: |
          set -euo pipefail
          args=(
            exec tools-pack linux build
            --dir "$RUNNER_TEMP/tools-pack"
            --cache-dir "$RUNNER_TEMP/tools-pack-cache"
            --namespace "$NAMESPACE"
            --portable
            --app-version "$VERSION"
            --to appimage
          )
          if [ "${CONTAINERIZED:-false}" = "true" ]; then
            args+=(--containerized)
          fi
          pnpm "${args[@]}"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/tools-pack/out/linux/namespaces/$NAMESPACE/builder/Open Design-$NAMESPACE.AppImage"
          test -f "$src" || { echo "::error::AppImage not found at $src"; exit 1; }
          # The AppRun packed into the AppImage must carry the FUSE fallback,
          # otherwise a plain `./xxx.AppImage` launch still fails at the sidecar.
          apprun="$RUNNER_TEMP/tools-pack/out/linux/namespaces/$NAMESPACE/appimage/AppRun"
          grep -q "OD_APPIMAGE_FALLBACK" "$apprun" \
            || { echo "::error::AppRun is missing the extract-and-run fallback"; exit 1; }
          # The packaged web config must carry the runtime-safe fingerprint guard,
          # otherwise the web sidecar cannot boot and the generation is retired.
          webconfig="$RUNNER_TEMP/tools-pack/out/linux/namespaces/$NAMESPACE/assembled/app/node_modules/@open-design/web/next.config.ts"
          grep -q "CMS_HOST_RELEASE_INPUTS.every" "$webconfig" \
            || { echo "::error::packaged web config is missing the fingerprint guard fix"; exit 1; }
          # Same naming as the upstream mac/win release assets.
          asset="open-design-${VERSION}-linux-x64.AppImage"
          mkdir -p dist
          cp "$src" "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256")
          ls -lh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${UPSTREAM_TAG}")"
          release_url="$(printf '%s' "$meta" | jq -r '.html_url')"

          # Upstream release URL first, then the upstream release description.
          {
            printf '%s\n\n' "$release_url"
            printf '%s' "$meta" | jq -r '.body // ""'
          } > notes.md

          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$TARGET_REPO" --clobber
            gh release edit "$RELEASE_TAG" --repo "$TARGET_REPO" \
              --title "$RELEASE_TAG" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$TARGET_REPO" \
              --title "$RELEASE_TAG" --notes-file notes.md
          fi

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="open-design-${VERSION}-linux-x64.AppImage"
          names="$(gh api "repos/${TARGET_REPO}/releases/tags/${RELEASE_TAG}" --jq '.assets[].name')"
          printf '%s\n' "$names" | grep -qx "$asset" \
            || { echo "::error::${asset} missing from ${RELEASE_TAG}"; exit 1; }
          printf '%s\n' "$names" | grep -qx "$asset.sha256" \
            || { echo "::error::${asset}.sha256 missing from ${RELEASE_TAG}"; exit 1; }
          echo "Verified ${RELEASE_TAG}: ${asset} + sha256"
