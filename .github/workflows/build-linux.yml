name: Build Linux release from upstream tag

on:
  schedule:
    # Daily at 03:17 UTC. Off-peak hour avoids the top-of-hour Actions queue.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Build one version, e.g. v0.27.0 (empty = backfill all newer tags)"
        required: false
        type: string
      force:
        description: "With tag: rebuild even if that vX.Y.Z tag already exists"
        required: false
        type: boolean
        default: false
      containerized:
        description: "Build inside electronuserland/builder Docker for wider glibc compatibility"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: linux-release-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: nexu-io/open-design
  TARGET_REPO: ${{ github.repository }}
  NAMESPACE: release-linux

jobs:
  resolve:
    name: Resolve tags to build via API
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
      cursor: ${{ steps.resolve.outputs.cursor }}
    steps:
      - name: Resolve tags
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          version_gt() {
            local newer="$1" older="$2"
            [ "$newer" != "$older" ] || return 1
            [ "$(printf '%s\n%s\n' "$older" "$newer" | sort -V | tail -n 1)" = "$newer" ]
          }

          # Upstream stable tags -> bare versions, ascending.
          upstream_raw="$(gh api "repos/${UPSTREAM_REPO}/tags?per_page=100" --paginate --jq '.[].name')"
          mapfile -t upstream_versions < <(printf '%s\n' "$upstream_raw" \
            | grep -E '^open-design-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^open-design-v//' | sort -V || true)
          if [ "${#upstream_versions[@]}" -eq 0 ]; then
            echo "::error::No open-design-vX.Y.Z tags found in ${UPSTREAM_REPO}"
            exit 1
          fi

          # The highest vX.Y.Z tag already present in this repo is the cursor.
          # Only upstream versions newer than it still need a release, so several
          # tags published on the same day are all picked up, and older tags are
          # never replayed.
          built_raw="$(gh api "repos/${TARGET_REPO}/tags?per_page=100" --paginate --jq '.[].name')"
          cursor="$(printf '%s\n' "$built_raw" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -V | tail -n 1 || true)"

          if [ -n "${INPUT_TAG:-}" ]; then
            # Accept v0.27.0, 0.27.0 or open-design-v0.27.0.
            v="${INPUT_TAG#open-design-v}"
            v="${v#v}"
            candidates=("$v")
          elif [ -z "$cursor" ]; then
            # Fresh repo: bootstrap with only the newest upstream version instead
            # of replaying the whole release history.
            candidates=("${upstream_versions[-1]}")
            echo "::notice::No vX.Y.Z tags in ${TARGET_REPO}; bootstrapping with ${candidates[0]}"
          else
            candidates=()
            for v in "${upstream_versions[@]}"; do
              if version_gt "$v" "$cursor"; then
                candidates+=("$v")
              fi
            done
          fi

          matrix='{"include":[]}'
          count=0
          for v in "${candidates[@]}"; do
            [ -n "$v" ] || continue
            upstream_tag="open-design-v${v}"
            release_tag="v${v}"

            # Release notes come from the matching upstream release.
            if ! gh api "repos/${UPSTREAM_REPO}/releases/tags/${upstream_tag}" >/dev/null 2>&1; then
              echo "::notice::${upstream_tag}: no published upstream release, skipping"
              continue
            fi

            # Idempotency: an already-tagged version is left alone unless forced.
            if [ "${FORCE:-false}" != "true" ] \
              && printf '%s\n' "$built_raw" | grep -qx "v${v}"; then
              echo "::notice::${release_tag}: already tagged in ${TARGET_REPO}, skipping"
              continue
            fi

            matrix="$(printf '%s' "$matrix" | jq -c \
              --arg upstream_tag "$upstream_tag" \
              --arg release_tag "$release_tag" \
              --arg version "$v" \
              '.include += [{upstream_tag:$upstream_tag, release_tag:$release_tag, version:$version}]')"
            count=$((count + 1))
          done

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "cursor=${cursor:-none}" >> "$GITHUB_OUTPUT"

          {
            echo "### Tags to build"
            echo "Cursor (latest tag in this repo): \`${cursor:-none}\`"
            if [ "$count" -eq 0 ]; then
              echo "Nothing to do — every upstream tag up to the cursor already has a release."
            else
              printf '%s' "$matrix" | jq -r '.include[].release_tag' | sed 's/^/- `/; s/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & publish ${{ matrix.release_tag }}
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    strategy:
      # One runner at a time, in version order — "依次打入" the missing tags.
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      UPSTREAM_TAG: ${{ matrix.upstream_tag }}
      RELEASE_TAG: ${{ matrix.release_tag }}
      VERSION: ${{ matrix.version }}
      CONTAINERIZED: ${{ inputs.containerized }}
    steps:
      - name: Checkout upstream source at tag
        uses: actions/checkout@v4
        with:
          repository: nexu-io/open-design
          ref: ${{ matrix.upstream_tag }}
          path: source

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build Linux AppImage
        working-directory: source
        run: |
          set -euo pipefail
          args=(
            exec tools-pack linux build
            --dir "$RUNNER_TEMP/tools-pack"
            --cache-dir "$RUNNER_TEMP/tools-pack-cache"
            --namespace "$NAMESPACE"
            --portable
            --app-version "$VERSION"
            --to appimage
          )
          if [ "${CONTAINERIZED:-false}" = "true" ]; then
            args+=(--containerized)
          fi
          pnpm "${args[@]}"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/tools-pack/out/linux/namespaces/$NAMESPACE/builder/Open Design-$NAMESPACE.AppImage"
          test -f "$src" || { echo "::error::AppImage not found at $src"; exit 1; }
          # Same naming as the upstream mac/win release assets.
          asset="open-design-${VERSION}-linux-x64.AppImage"
          mkdir -p dist
          cp "$src" "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256")
          ls -lh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${UPSTREAM_TAG}")"
          release_url="$(printf '%s' "$meta" | jq -r '.html_url')"

          # Upstream release URL first, then the upstream release description.
          {
            printf '%s\n\n' "$release_url"
            printf '%s' "$meta" | jq -r '.body // ""'
          } > notes.md

          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$TARGET_REPO" --clobber
            gh release edit "$RELEASE_TAG" --repo "$TARGET_REPO" \
              --title "$RELEASE_TAG" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$TARGET_REPO" \
              --title "$RELEASE_TAG" --notes-file notes.md
          fi
