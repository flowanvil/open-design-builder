name: Build Linux release from upstream tag

on:
  schedule:
    # Daily at 03:17 UTC. Off-peak hour avoids the top-of-hour Actions queue.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build, e.g. v0.27.0 (empty = latest upstream tag)"
        required: false
        type: string
      force:
        description: "Rebuild even if a release for this version already exists"
        required: false
        type: boolean
        default: false
      containerized:
        description: "Build inside electronuserland/builder Docker for wider glibc compatibility"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: linux-release-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: nexu-io/open-design
  TARGET_REPO: ${{ github.repository }}
  NAMESPACE: release-linux

jobs:
  resolve:
    name: Resolve upstream tag via API
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # Pull the tag list from the upstream repo through the GitHub REST API.
          all_tags="$(gh api "repos/${UPSTREAM_REPO}/tags?per_page=100" --paginate --jq '.[].name')"
          upstream_tag="$(printf '%s\n' "$all_tags" \
            | grep -E '^open-design-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1 || true)"

          if [ -n "${INPUT_TAG:-}" ]; then
            # Accept v0.27.0, 0.27.0 or open-design-v0.27.0.
            version="$INPUT_TAG"
            version="${version#open-design-v}"
            version="${version#v}"
            upstream_tag="open-design-v${version}"
          else
            version="${upstream_tag#open-design-v}"
          fi
          if [ -z "$upstream_tag" ]; then
            echo "::error::No open-design-v* tag found in ${UPSTREAM_REPO}"
            exit 1
          fi

          # Builder-repo release tags and titles use the vx.y.z form, while the
          # upstream checkout / release lookup still needs open-design-vx.y.z.
          release_tag="v${version}"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Release notes come from the matching upstream release, so a tag
          # without a published release cannot be published here.
          if ! gh api "repos/${UPSTREAM_REPO}/releases/tags/${upstream_tag}" >/dev/null 2>&1; then
            echo "::notice::Upstream tag ${upstream_tag} has no published release; skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Idempotent daily run: only build a version that has no release here yet.
          if [ "${FORCE:-false}" != "true" ] \
            && gh api "repos/${TARGET_REPO}/releases/tags/${release_tag}" >/dev/null 2>&1; then
            echo "::notice::Release ${release_tag} already exists in ${TARGET_REPO}; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build & publish ${{ needs.resolve.outputs.release_tag }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      CONTAINERIZED: ${{ inputs.containerized }}
    steps:
      - name: Checkout upstream source at tag
        uses: actions/checkout@v4
        with:
          repository: nexu-io/open-design
          ref: ${{ needs.resolve.outputs.upstream_tag }}
          path: source

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build Linux AppImage
        working-directory: source
        run: |
          set -euo pipefail
          args=(
            exec tools-pack linux build
            --dir "$RUNNER_TEMP/tools-pack"
            --cache-dir "$RUNNER_TEMP/tools-pack-cache"
            --namespace "$NAMESPACE"
            --portable
            --app-version "$VERSION"
            --to appimage
          )
          if [ "${CONTAINERIZED:-false}" = "true" ]; then
            args+=(--containerized)
          fi
          pnpm "${args[@]}"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/tools-pack/out/linux/namespaces/$NAMESPACE/builder/Open Design-$NAMESPACE.AppImage"
          test -f "$src" || { echo "::error::AppImage not found at $src"; exit 1; }
          # Same naming as the upstream mac/win release assets.
          asset="open-design-${VERSION}-linux-x64.AppImage"
          mkdir -p dist
          cp "$src" "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256")
          ls -lh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${UPSTREAM_TAG}")"
          release_url="$(printf '%s' "$meta" | jq -r '.html_url')"

          # Upstream release URL first, then the upstream release description.
          {
            printf '%s\n\n' "$release_url"
            printf '%s' "$meta" | jq -r '.body // ""'
          } > notes.md

          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$TARGET_REPO" --clobber
            gh release edit "$RELEASE_TAG" --repo "$TARGET_REPO" \
              --title "$RELEASE_TAG" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$TARGET_REPO" \
              --title "$RELEASE_TAG" --notes-file notes.md
          fi
